name: Dispatch
options:
  developmentLanguage: en
  bundleIdPrefix: de.siropolov
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  Dispatch:
    type: application
    platform: iOS
    sources:
      - Dispatch
    info:
      path: Dispatch/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - de.siropolov.dispatch.refresh
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.siropolov.dispatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Dispatch
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  DispatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DispatchTests
    dependencies:
      - target: Dispatch
schemes:
  Dispatch:
    build:
      targets:
        Dispatch: all
        DispatchTests: [test]
    test:
      targets:
        - DispatchTests
