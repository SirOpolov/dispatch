name: Laufbursche
options:
  bundleIdPrefix: de.greismicha
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  Laufbursche:
    type: application
    platform: iOS
    sources:
      - Laufbursche
    info:
      path: Laufbursche/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - de.greismicha.laufbursche.refresh
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.greismicha.laufbursche
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Laufbursche
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  LaufburscheTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LaufburscheTests
    dependencies:
      - target: Laufbursche
schemes:
  Laufbursche:
    build:
      targets:
        Laufbursche: all
        LaufburscheTests: [test]
    test:
      targets:
        - LaufburscheTests
