name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Tests
        run: |
          xcrun simctl list devices available
          xcodebuild test -scheme Dispatch -destination 'platform=iOS Simulator,name=iPhone 17'
      - name: Build
        run: xcodebuild build -scheme Dispatch -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Dispatch.app Payload/
          zip -r Dispatch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Dispatch
          path: Dispatch.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Dispatch.ipa --title "Dispatch $GITHUB_REF_NAME" --generate-notes
