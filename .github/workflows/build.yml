name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Tests
        run: |
          xcrun simctl list devices available
          xcodebuild test -scheme Laufbursche -destination 'platform=iOS Simulator,name=iPhone 17'
      - name: Build
        run: xcodebuild build -scheme Laufbursche -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Laufbursche.app Payload/
          zip -r Laufbursche.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Laufbursche
          path: Laufbursche.ipa
